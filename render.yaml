services:
  - type: web
    name: bus-route-performance-tracker
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bus-route-performance-db
          property: connectionString
      - key: ENABLE_MEMORY_FALLBACK
        value: "false"
      - key: BUS_CAPACITY
        value: "60"
      - key: DELAY_RISK_THRESHOLD
        value: "12"
      - key: ANALYTICS_TIMEZONE
        value: Asia/Singapore

databases:
  - name: bus-route-performance-db
    plan: free
    region: oregon
    databaseName: bus_tracker
    postgresMajorVersion: "18"
